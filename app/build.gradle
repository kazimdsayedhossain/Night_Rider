plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.kazisayed.deliverit3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kazisayed.deliverit3d'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets.main.jniLibs.srcDirs = ['build/generated/jniLibs']

    androidResources {
        noCompress 'glb', 'ktx', 'ogg', 'wav'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        resources.excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
    }
}

configurations {
    natives
}

configurations.configureEach {
    exclude group: 'com.google.guava', module: 'listenablefuture'
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
    enabled = false
}

dependencies {
    // LibGDX
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.14.2'
    implementation 'com.github.mgsx-dev.gdx-gltf:gltf:2.3.0'
    implementation 'org.iq80.leveldb:leveldb:0.12'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.activity:activity:1.9.0'

    // Firebase BOM — pins all Firebase versions together
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Native ABIs
    for (abi in ['arm64-v8a', 'armeabi-v7a', 'x86_64']) {
        natives "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-$abi"
    }
}

tasks.register('copyAndroidNatives') {
    inputs.files configurations.natives
    outputs.dir layout.buildDirectory.dir('generated/jniLibs')
    doLast {
        configurations.natives.files.each { jar ->
            def abi = ['arm64-v8a', 'armeabi-v7a', 'x86_64'].find { jar.name.contains(it) }
            copy {
                from zipTree(jar)
                include '**/*.so'
                into layout.buildDirectory.dir("generated/jniLibs/$abi")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'copyAndroidNatives'
}
